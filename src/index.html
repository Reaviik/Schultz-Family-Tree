<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f0e7">
    <meta name="description" content="Árvore genealógica da família Schultz — memórias, histórias e conexões preservadas entre gerações.">
    <title>Schultz — Árvore Genealógica</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%232f5d50'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' fill='%23f5f0e7' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="app-page">
    <div class="page">
        <header class="site-header">
            <div class="header-inner">
                <a class="brand" href="index.html" aria-label="Schultz — Árvore Genealógica">
                    <span class="brand-mark" aria-hidden="true">S</span>
                    <span>
                        <span class="brand-title">Schultz</span>
                        <span class="brand-sub">Árvore genealógica</span>
                    </span>
                </a>

                <div class="header-actions">
                    <button type="button" class="btn btn-ghost" onclick="openQRModal()" aria-label="Compartilhar e apoiar o projeto">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                            <path d="M14 14h3v3h-3zM19 19h2v2h-2zM14 20h2M20 14h1"></path>
                        </svg>
                        <span class="btn-label">Compartilhar</span>
                    </button>
                    <a href="formulario.html" class="btn btn-primary">
                        <span>Participar</span>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <div class="toolbar">
            <div id="tree-controls" class="segmented" role="tablist" aria-label="Escolher ramo da família"></div>
        </div>

        <main class="stage">
            <div id="tree-pan-wrapper" class="tree-scroll">
                <div id="tree-canvas" class="tree-canvas">
                    <div id="family-tree">
                        <!-- Estrutura da árvore será gerada pelo JavaScript -->
                    </div>
                </div>
            </div>

            <div class="stage-hint" id="stage-hint">
                <span class="dot" aria-hidden="true"></span>
                Arraste para mover o canvas · Clique em uma pessoa para ver a história
            </div>
        </main>
    </div>

    <script src="scripts/family-data.js"></script>
    <script src="scripts/tree-generator.js"></script>
</body>

</html>
